

<!DOCTYPE html>
<html>
<head>
    <title>My Book</title>

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .book {
            width: 350px;
            height: 480px;
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            text-align: center;
            padding: 25px;
            box-sizing: border-box;
            border: 5px solid #d4af37;
            box-shadow: 5px 5px 15px gray;
        }

        h1 {
            margin-top: 35px;
            font-size: 32px;
        }

        h2 {
            color: #ffd700;
            margin-top: 20px;
        }

        .picture {
            font-size: 90px;
            margin-top: 30px;
        }

        .author {
            margin-top: 35px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="book">

        <h1>MY BOOK</h1>

        <h2>COMPUTER SCIENCE</h2>

        <div class="picture">
            📚
        </div>

        <p>Learn Something New</p>

        <div class="author">
            Author: Your Name
        </div>

    </div>

</body>
</html>
